<div class="uuid-wrap">
  <div class="panel">
    <div class="panel-head"><h3>Generate UUID v4</h3>
      <span class="badge badge-success"><i data-lucide="shield-check"></i> Generated locally with a CSPRNG</span></div>
    <div class="panel-body stack">
      <div class="uuid-opts">
        <div class="field"><label for="uuid-count">Count (1-1000)</label>
          <input class="input" id="uuid-count" type="number" min="1" max="1000" value="5"></div>
        <div class="field"><label for="uuid-sep">Separator (copy / download)</label>
          <select class="select" id="uuid-sep">
            <option value="newline">New line</option><option value="comma">Comma</option>
            <option value="comma-space">Comma + space</option><option value="space">Space</option>
          </select></div>
      </div>
      <div class="row uuid-checks">
        <label class="check"><input type="checkbox" id="uuid-upper"> Uppercase</label>
        <label class="check"><input type="checkbox" id="uuid-hyphens" checked> Hyphens</label>
        <label class="check"><input type="checkbox" id="uuid-braces"> Braces { }</label>
        <label class="check"><input type="checkbox" id="uuid-urn"> urn:uuid: prefix</label>
      </div>
      <div class="row">
        <button class="btn btn-primary" data-action="generate"><i data-lucide="refresh-cw"></i> Generate / Regenerate</button>
        <button class="btn" data-action="nil"><i data-lucide="circle-off"></i> Nil UUID</button>
        <button class="btn" data-action="copy-all"><i data-lucide="copy"></i> Copy all</button>
        <button class="btn" data-action="download"><i data-lucide="download"></i> Download .txt</button>
        <button class="btn" data-action="clear"><i data-lucide="eraser"></i> Clear</button>
      </div>
      <div id="uuid-msg" hidden></div>
    </div>
  </div>

  <div class="panel uuid-gap">
    <div class="panel-head"><h3>Results <span class="badge" id="uuid-total">0</span></h3></div>
    <div class="uuid-list" id="uuid-list"><p class="hint uuid-pad">Nothing generated yet.</p></div>
  </div>

  <div class="panel uuid-gap">
    <div class="panel-head"><h3>Validator / inspector</h3></div>
    <div class="panel-body stack">
      <div class="row uuid-check-row">
        <input class="input mono" id="uuid-inspect" spellcheck="false" placeholder="Paste a UUID, e.g. 123e4567-e89b-12d3-a456-426614174000" aria-label="UUID to inspect">
        <button class="btn" data-action="inspect-clear"><i data-lucide="eraser"></i> Clear</button>
      </div>
      <div id="uuid-inspect-out" hidden></div>
    </div>
  </div>
</div>
