<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Folio — Word document editor</title>
  <meta name="description" content="Open, edit and save Word (.docx) documents entirely in your browser.">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/document.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='5' y='2' width='22' height='28' rx='2' fill='%232350A0'/%3E%3Cpath d='M10 10h12M10 15h12M10 20h8' stroke='white' stroke-width='2'/%3E%3C/svg%3E">
</head>
<body>

<!-- ================= Icon sprite (inline so the app works without extra requests) ================= -->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <defs>
    <symbol id="i-new" viewBox="0 0 24 24"><path d="M14 3H6.5A1.5 1.5 0 0 0 5 4.5v15A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5V8z"/><path d="M14 3v5h5M12 11v6M9 14h6"/></symbol>
    <symbol id="i-open" viewBox="0 0 24 24"><path d="M3 7.5V18a1.5 1.5 0 0 0 1.5 1.5h15A1.5 1.5 0 0 0 21 18V9.5A1.5 1.5 0 0 0 19.5 8H12l-2-2.5H4.5A1.5 1.5 0 0 0 3 7z"/></symbol>
    <symbol id="i-save" viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 19.5h14"/></symbol>
    <symbol id="i-print" viewBox="0 0 24 24"><path d="M7 9V4h10v5M7 17H5a1.5 1.5 0 0 1-1.5-1.5v-5A1.5 1.5 0 0 1 5 9h14a1.5 1.5 0 0 1 1.5 1.5v5A1.5 1.5 0 0 1 19 17h-2M7 14h10v6H7z"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></symbol>
    <symbol id="i-redo" viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></symbol>
    <symbol id="i-align-left" viewBox="0 0 24 24"><path d="M4 6h16M4 10h10M4 14h16M4 18h10"/></symbol>
    <symbol id="i-align-center" viewBox="0 0 24 24"><path d="M4 6h16M7 10h10M4 14h16M7 18h10"/></symbol>
    <symbol id="i-align-right" viewBox="0 0 24 24"><path d="M4 6h16M10 10h10M4 14h16M10 18h10"/></symbol>
    <symbol id="i-align-justify" viewBox="0 0 24 24"><path d="M4 6h16M4 10h16M4 14h16M4 18h16"/></symbol>
    <symbol id="i-bullets" viewBox="0 0 24 24"><circle cx="5" cy="7" r="1.3" fill="currentColor" stroke="none"/><circle cx="5" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="5" cy="17" r="1.3" fill="currentColor" stroke="none"/><path d="M9.5 7H20M9.5 12H20M9.5 17H20"/></symbol>
    <symbol id="i-numbers" viewBox="0 0 24 24"><path d="M10 7h10M10 12h10M10 17h10"/><path d="M4 5.5 5.3 5v4M4.2 11.2c.3-.6 1.9-.8 2 .2.1.8-2.1 1.9-2.1 2.6h2.2M4.1 15.6h2l-1 1.2c.9 0 1.2.5 1.2.9 0 .9-1.6 1.1-2.2.5" stroke-width="1.2"/></symbol>
    <symbol id="i-indent" viewBox="0 0 24 24"><path d="M4 5h16M11 10h9M11 14h9M4 19h16M4 9l3 3-3 3"/></symbol>
    <symbol id="i-outdent" viewBox="0 0 24 24"><path d="M4 5h16M11 10h9M11 14h9M4 19h16M7 9l-3 3 3 3"/></symbol>
    <symbol id="i-spacing" viewBox="0 0 24 24"><path d="M11 6h9M11 12h9M11 18h9M5.5 4v16M3.5 6l2-2 2 2M3.5 18l2 2 2-2"/></symbol>
    <symbol id="i-painter" viewBox="0 0 24 24"><path d="M18.37 2.63 14 7l-1.59-1.59a2 2 0 0 0-2.82 0L8 7l9 9 1.59-1.59a2 2 0 0 0 0-2.82L17 10l4.37-4.37a2.12 2.12 0 1 0-3-3Z"/><path d="M9 8c-2 3-4 3.5-7 4l8 10c2-1 6-5 6-7"/><path d="M14.5 17.5 4.5 15"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.66 0l3-3a4 4 0 0 0-5.66-5.66l-1 1"/><path d="M14 10a4 4 0 0 0-5.66 0l-3 3a4 4 0 0 0 5.66 5.66l1-1"/></symbol>
    <symbol id="i-table" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="15" rx="1.5"/><path d="M3 9.5h18M3 14.5h18M9 4.5v15M15 4.5v15"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="15" rx="1.5"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="m21 16-5-5-9.5 8.5"/></symbol>
    <symbol id="i-pagebreak" viewBox="0 0 24 24"><path d="M6 3v5.5h12V3M6 21v-5.5h12V21"/><path d="M3 12h2.5M8 12h3M13 12h3M18.5 12H21"/></symbol>
    <symbol id="i-find" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="m20 20-5.2-5.2"/></symbol>
    <symbol id="i-clear" viewBox="0 0 24 24"><path d="M5 5h11M10.5 5 8 18M14 15l6 6M20 15l-6 6"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-highlighter" viewBox="0 0 24 24"><path d="m9 15-2.5 2.5L5 16l1.5-2.5L15.5 4.5a2.1 2.1 0 0 1 3 3z"/><path d="m12 7.9 3 3"/></symbol>
    <symbol id="i-layout" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="1.5"/><path d="M8.5 7h7M8.5 10.5h7M8.5 14h4"/></symbol>
  </defs>
</svg>

<div class="app" id="app">
  <!-- ================= Title bar: file actions + document name ================= -->
  <header class="titlebar">
    <div class="brand" aria-hidden="true">
      <svg viewBox="0 0 32 32" width="22" height="22"><rect x="5" y="2" width="22" height="28" rx="2" fill="#fff"/><path d="M10 10h12M10 15h12M10 20h8" stroke="#2350A0" stroke-width="2"/></svg>
      <span>Folio</span>
    </div>

    <nav class="filebar" aria-label="File">
      <button type="button" class="file-btn" data-action="new" title="New blank document (Ctrl+Alt+N)">
        <svg class="ic"><use href="#i-new"/></svg><span>New</span>
      </button>
      <button type="button" class="file-btn" data-action="open" title="Open a .docx or .doc file (Ctrl+O)">
        <svg class="ic"><use href="#i-open"/></svg><span>Open</span>
      </button>
      <button type="button" class="file-btn file-btn--primary" data-action="save" title="Download as .docx (Ctrl+S)">
        <svg class="ic"><use href="#i-save"/></svg><span>Save .docx</span>
      </button>
      <button type="button" class="file-btn" data-action="print" title="Print or save as PDF (Ctrl+P)">
        <svg class="ic"><use href="#i-print"/></svg><span>Print</span>
      </button>
    </nav>

    <div class="docname">
      <label for="docName" class="visually-hidden">Document name</label>
      <input id="docName" type="text" value="Untitled document" spellcheck="false" autocomplete="off">
      <span class="save-state" id="saveState" aria-live="polite">No changes</span>
    </div>
    <input type="file" id="fileInput" accept=".docx,.doc,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/msword" hidden>
  </header>

  <!-- ================= Formatting toolbar ================= -->
  <div class="toolbar" id="toolbar" role="toolbar" aria-label="Formatting">
    <div class="tb-group">
      <button type="button" class="tb-btn" data-cmd="undo" title="Undo (Ctrl+Z)" aria-label="Undo"><svg class="ic"><use href="#i-undo"/></svg></button>
      <button type="button" class="tb-btn" data-cmd="redo" title="Redo (Ctrl+Y)" aria-label="Redo"><svg class="ic"><use href="#i-redo"/></svg></button>
    </div>

    <div class="tb-group">
      <select id="blockStyle" class="tb-select tb-select--style" title="Paragraph style" aria-label="Paragraph style">
        <option value="p">Normal</option>
        <option value="title">Title</option>
        <option value="subtitle">Subtitle</option>
        <option value="h1">Heading 1</option>
        <option value="h2">Heading 2</option>
        <option value="h3">Heading 3</option>
        <option value="h4">Heading 4</option>
        <option value="blockquote">Quote</option>
      </select>
    </div>

    <div class="tb-group">
      <select id="fontFamily" class="tb-select tb-select--font" title="Font" aria-label="Font">
        <option value="Calibri">Calibri</option>
        <option value="Arial">Arial</option>
        <option value="Cambria">Cambria</option>
        <option value="Georgia">Georgia</option>
        <option value="Times New Roman">Times New Roman</option>
        <option value="Garamond">Garamond</option>
        <option value="Verdana">Verdana</option>
        <option value="Tahoma">Tahoma</option>
        <option value="Trebuchet MS">Trebuchet MS</option>
        <option value="Courier New">Courier New</option>
      </select>
      <input id="fontSize" class="tb-input tb-input--size" type="text" inputmode="decimal" list="fontSizes" value="11" title="Font size (pt)" aria-label="Font size in points">
      <datalist id="fontSizes">
        <option value="8"></option><option value="9"></option><option value="10"></option><option value="11"></option>
        <option value="12"></option><option value="14"></option><option value="16"></option><option value="18"></option>
        <option value="20"></option><option value="24"></option><option value="28"></option><option value="36"></option>
        <option value="48"></option><option value="72"></option>
      </datalist>
    </div>

    <div class="tb-group">
      <button type="button" class="tb-btn tb-glyph" data-cmd="bold" title="Bold (Ctrl+B)" aria-label="Bold" aria-pressed="false"><b>B</b></button>
      <button type="button" class="tb-btn tb-glyph" data-cmd="italic" title="Italic (Ctrl+I)" aria-label="Italic" aria-pressed="false"><i>I</i></button>
      <button type="button" class="tb-btn tb-glyph" data-cmd="underline" title="Underline (Ctrl+U)" aria-label="Underline" aria-pressed="false"><u>U</u></button>
      <button type="button" class="tb-btn tb-glyph" data-cmd="strikeThrough" title="Strikethrough" aria-label="Strikethrough" aria-pressed="false"><s>S</s></button>
      <button type="button" class="tb-btn tb-glyph" data-cmd="superscript" title="Superscript (Ctrl+Shift+=)" aria-label="Superscript" aria-pressed="false">x<sup>2</sup></button>
      <button type="button" class="tb-btn tb-glyph" data-cmd="subscript" title="Subscript (Ctrl+=)" aria-label="Subscript" aria-pressed="false">x<sub>2</sub></button>
      <div class="split" data-color="fore">
        <button type="button" class="tb-btn split-main" data-cmd="foreColor" title="Font color" aria-label="Apply font color">
          <span class="color-glyph">A<span class="color-bar" id="foreBar"></span></span>
        </button>
        <button type="button" class="tb-btn split-arrow" data-popover="forePalette" title="Choose font color" aria-label="Choose font color" aria-haspopup="true" aria-expanded="false"><svg class="ic ic-sm"><use href="#i-chevron"/></svg></button>
      </div>
      <div class="split" data-color="back">
        <button type="button" class="tb-btn split-main" data-cmd="hiliteColor" title="Highlight color" aria-label="Apply highlight color">
          <span class="color-glyph"><svg class="ic"><use href="#i-highlighter"/></svg><span class="color-bar" id="backBar"></span></span>
        </button>
        <button type="button" class="tb-btn split-arrow" data-popover="backPalette" title="Choose highlight color" aria-label="Choose highlight color" aria-haspopup="true" aria-expanded="false"><svg class="ic ic-sm"><use href="#i-chevron"/></svg></button>
      </div>
      <button type="button" class="tb-btn" data-cmd="removeFormat" title="Clear text formatting" aria-label="Clear text formatting"><svg class="ic"><use href="#i-clear"/></svg></button>
      <button type="button" class="tb-btn" data-cmd="formatPainter" title="Format painter: copy the formatting at the cursor, then select the text to apply it to" aria-label="Format painter" aria-pressed="false"><svg class="ic"><use href="#i-painter"/></svg></button>
      <button type="button" class="tb-btn tb-glyph" data-popover="caseMenu" title="Change case" aria-label="Change case" aria-haspopup="true" aria-expanded="false">Aa</button>
    </div>

    <div class="tb-group">
      <button type="button" class="tb-btn" data-cmd="justifyLeft" title="Align left (Ctrl+L)" aria-label="Align left" aria-pressed="false"><svg class="ic"><use href="#i-align-left"/></svg></button>
      <button type="button" class="tb-btn" data-cmd="justifyCenter" title="Center (Ctrl+E)" aria-label="Center" aria-pressed="false"><svg class="ic"><use href="#i-align-center"/></svg></button>
      <button type="button" class="tb-btn" data-cmd="justifyRight" title="Align right (Ctrl+R)" aria-label="Align right" aria-pressed="false"><svg class="ic"><use href="#i-align-right"/></svg></button>
      <button type="button" class="tb-btn" data-cmd="justifyFull" title="Justify (Ctrl+J)" aria-label="Justify" aria-pressed="false"><svg class="ic"><use href="#i-align-justify"/></svg></button>
    </div>

    <div class="tb-group">
      <button type="button" class="tb-btn" data-cmd="insertUnorderedList" title="Bulleted list" aria-label="Bulleted list" aria-pressed="false"><svg class="ic"><use href="#i-bullets"/></svg></button>
      <button type="button" class="tb-btn" data-cmd="insertOrderedList" title="Numbered list" aria-label="Numbered list" aria-pressed="false"><svg class="ic"><use href="#i-numbers"/></svg></button>
      <button type="button" class="tb-btn" data-cmd="outdent" title="Decrease indent (Shift+Tab in lists)" aria-label="Decrease indent"><svg class="ic"><use href="#i-outdent"/></svg></button>
      <button type="button" class="tb-btn" data-cmd="indent" title="Increase indent (Tab in lists)" aria-label="Increase indent"><svg class="ic"><use href="#i-indent"/></svg></button>
      <button type="button" class="tb-btn tb-glyph" data-cmd="paragraph" title="Paragraph settings: indents and spacing" aria-label="Paragraph settings">&para;</button>
      <button type="button" class="tb-btn" data-popover="spacingMenu" title="Line spacing" aria-label="Line spacing" aria-haspopup="true" aria-expanded="false"><svg class="ic"><use href="#i-spacing"/></svg><svg class="ic ic-sm"><use href="#i-chevron"/></svg></button>
    </div>

    <div class="tb-group">
      <button type="button" class="tb-btn" data-cmd="link" title="Insert or edit link (Ctrl+K)" aria-label="Insert link"><svg class="ic"><use href="#i-link"/></svg></button>
      <button type="button" class="tb-btn" data-popover="tableMenu" title="Table" aria-label="Table" aria-haspopup="true" aria-expanded="false"><svg class="ic"><use href="#i-table"/></svg><svg class="ic ic-sm"><use href="#i-chevron"/></svg></button>
      <button type="button" class="tb-btn" data-cmd="image" title="Insert image from your computer" aria-label="Insert image"><svg class="ic"><use href="#i-image"/></svg></button>
      <button type="button" class="tb-btn tb-glyph" data-cmd="footnote" title="Insert footnote" aria-label="Insert footnote">AB&sup1;</button>
      <button type="button" class="tb-btn tb-glyph" data-cmd="toc" title="Insert or update table of contents (from headings)" aria-label="Table of contents">TOC</button>
      <button type="button" class="tb-btn" data-cmd="pageBreak" title="Insert page break (Ctrl+Enter)" aria-label="Insert page break"><svg class="ic"><use href="#i-pagebreak"/></svg></button>
      <button type="button" class="tb-btn tb-glyph" data-popover="specialMenu" title="Insert symbol, date or horizontal line" aria-label="Insert symbol, date or horizontal line" aria-haspopup="true" aria-expanded="false">&#937;</button>
      <input type="file" id="imageInput" accept="image/png,image/jpeg,image/gif,image/webp,image/bmp,image/svg+xml" hidden>
    </div>

    <div class="tb-group">
      <button type="button" class="tb-btn" data-cmd="find" title="Find and replace (Ctrl+F / Ctrl+H)" aria-label="Find and replace"><svg class="ic"><use href="#i-find"/></svg></button>
      <button type="button" class="tb-btn" data-popover="layoutMenu" title="Page layout" aria-label="Page layout" aria-haspopup="true" aria-expanded="false"><svg class="ic"><use href="#i-layout"/></svg><svg class="ic ic-sm"><use href="#i-chevron"/></svg></button>
    </div>
  </div>

  <!-- ================= Popovers (opened from toolbar) ================= -->
  <div class="popover" id="forePalette" role="dialog" aria-label="Font colors" hidden>
    <div class="swatches" data-target="fore"></div>
    <div class="pop-row">
      <button type="button" class="pop-link" data-color-value="#000000">Automatic</button>
      <label class="pop-link">More colors…<input type="color" data-custom="fore" value="#c00000"></label>
    </div>
  </div>
  <div class="popover" id="backPalette" role="dialog" aria-label="Highlight colors" hidden>
    <div class="swatches swatches--hl" data-target="back"></div>
    <div class="pop-row">
      <button type="button" class="pop-link" data-color-value="transparent">No highlight</button>
      <label class="pop-link">More colors…<input type="color" data-custom="back" value="#ffff00"></label>
    </div>
  </div>
  <div class="popover popover--menu" id="caseMenu" role="menu" aria-label="Change case" hidden>
    <button type="button" role="menuitem" data-case="sentence">Sentence case</button>
    <button type="button" role="menuitem" data-case="lower">lowercase</button>
    <button type="button" role="menuitem" data-case="upper">UPPERCASE</button>
    <button type="button" role="menuitem" data-case="title">Capitalize Each Word</button>
    <button type="button" role="menuitem" data-case="toggle">tOGGLE cASE</button>
  </div>
  <div class="popover popover--menu popover--special" id="specialMenu" role="dialog" aria-label="Insert special" hidden>
    <div class="symbol-grid" id="symbolGrid"></div>
    <button type="button" role="menuitem" data-special="date">Today&rsquo;s date</button>
    <button type="button" role="menuitem" data-special="line">Horizontal line</button>
  </div>
  <div class="popover popover--menu" id="spacingMenu" role="menu" aria-label="Line spacing" hidden>
    <button type="button" role="menuitemradio" data-spacing="1">1.0</button>
    <button type="button" role="menuitemradio" data-spacing="1.15">1.15</button>
    <button type="button" role="menuitemradio" data-spacing="1.5">1.5</button>
    <button type="button" role="menuitemradio" data-spacing="2">2.0</button>
    <button type="button" role="menuitemradio" data-spacing="2.5">2.5</button>
    <button type="button" role="menuitemradio" data-spacing="3">3.0</button>
  </div>
  <div class="popover popover--table" id="tableMenu" role="dialog" aria-label="Table" hidden>
    <p class="pop-title" id="gridLabel">Insert table</p>
    <div class="grid-picker" id="gridPicker" aria-describedby="gridLabel"></div>
    <div class="pop-row pop-row--inputs">
      <label>Rows <input type="number" id="tblRows" min="1" max="100" value="3"></label>
      <label>Columns <input type="number" id="tblCols" min="1" max="20" value="3"></label>
      <button type="button" class="btn btn--small" id="tblInsert">Insert</button>
    </div>
    <div class="table-tools" id="tableTools">
      <p class="pop-title">Current table</p>
      <button type="button" data-table="rowAbove">Insert row above</button>
      <button type="button" data-table="rowBelow">Insert row below</button>
      <button type="button" data-table="colLeft">Insert column left</button>
      <button type="button" data-table="colRight">Insert column right</button>
      <button type="button" data-table="mergeCells">Merge selected cells</button>
      <button type="button" data-table="splitCell">Split merged cell</button>
      <button type="button" data-table="headerRow">Header row on / off</button>
      <button type="button" data-table="borders">Borders on / off</button>
      <div class="shade-row" role="group" aria-label="Cell shading">
        <span>Shade cell</span>
        <button type="button" class="shade-sw" data-table="shade:#fff2cc" title="Yellow" style="background:#fff2cc"></button>
        <button type="button" class="shade-sw" data-table="shade:#e2efda" title="Green" style="background:#e2efda"></button>
        <button type="button" class="shade-sw" data-table="shade:#ddebf7" title="Blue" style="background:#ddebf7"></button>
        <button type="button" class="shade-sw" data-table="shade:#fce4d6" title="Orange" style="background:#fce4d6"></button>
        <button type="button" class="shade-sw" data-table="shade:#ededed" title="Grey" style="background:#ededed"></button>
        <button type="button" class="shade-sw shade-none" data-table="shade:" title="No shading">&times;</button>
      </div>
      <button type="button" data-table="deleteRow">Delete row</button>
      <button type="button" data-table="deleteCol">Delete column</button>
      <button type="button" data-table="deleteTable" class="danger">Delete table</button>
      <p class="pop-note" id="tableToolsNote"></p>
    </div>
  </div>
  <div class="popover popover--layout" id="layoutMenu" role="dialog" aria-label="Page layout" hidden>
    <label>Paper size
      <select id="paperSize">
        <option value="letter">Letter (8.5 × 11 in)</option>
        <option value="a4">A4 (210 × 297 mm)</option>
        <option value="legal">Legal (8.5 × 14 in)</option>
        <option value="custom" disabled>Custom (from file)</option>
      </select>
    </label>
    <label>Orientation
      <select id="orientation">
        <option value="portrait">Portrait</option>
        <option value="landscape">Landscape</option>
      </select>
    </label>
    <label>Margins
      <select id="marginPreset">
        <option value="normal">Normal (1 in)</option>
        <option value="narrow">Narrow (0.5 in)</option>
        <option value="moderate">Moderate (1 in × 0.75 in)</option>
        <option value="wide">Wide (1 in × 2 in)</option>
        <option value="custom" disabled>Custom (from file)</option>
      </select>
    </label>
  </div>

  <!-- ================= Find & replace panel ================= -->
  <section class="find-panel" id="findPanel" aria-label="Find and replace" hidden>
    <div class="find-row">
      <label for="findInput" class="visually-hidden">Find</label>
      <input id="findInput" type="search" placeholder="Find in document" autocomplete="off">
      <span class="find-count" id="findCount" aria-live="polite"></span>
      <button type="button" class="tb-btn" id="findPrev" title="Previous match (Shift+Enter)" aria-label="Previous match"><svg class="ic"><use href="#i-up"/></svg></button>
      <button type="button" class="tb-btn" id="findNext" title="Next match (Enter)" aria-label="Next match"><svg class="ic"><use href="#i-down"/></svg></button>
      <button type="button" class="tb-btn" id="findClose" title="Close (Esc)" aria-label="Close find and replace"><svg class="ic"><use href="#i-close"/></svg></button>
    </div>
    <div class="find-row">
      <label for="replaceInput" class="visually-hidden">Replace with</label>
      <input id="replaceInput" type="text" placeholder="Replace with" autocomplete="off">
      <button type="button" class="btn btn--small" id="replaceOne">Replace</button>
      <button type="button" class="btn btn--small" id="replaceAll">Replace all</button>
    </div>
    <div class="find-row find-options">
      <label><input type="checkbox" id="findCase"> Match case</label>
      <label><input type="checkbox" id="findWord"> Whole words</label>
    </div>
  </section>

  <!-- ================= Notices (import warnings, errors) ================= -->
  <div class="notice" id="notice" role="status" hidden>
    <div class="notice-body" id="noticeBody"></div>
    <button type="button" class="tb-btn" id="noticeClose" aria-label="Dismiss notice"><svg class="ic"><use href="#i-close"/></svg></button>
  </div>

  <!-- ================= Workspace with the document page ================= -->
  <main class="workspace" id="workspace">
    <div class="page-stack" id="pageStack">
      <div class="page" id="page">
        <div class="page-markers" id="pageMarkers" aria-hidden="true"></div>
        <div class="hf hf-header doc" id="pageHeader" contenteditable="true" spellcheck="true" role="textbox" aria-multiline="true"
             aria-label="Page header" data-placeholder="Header: click to type. It repeats on every page in Word."></div>
        <div class="hf hf-footer doc" id="pageFooter" contenteditable="true" spellcheck="true" role="textbox" aria-multiline="true"
             aria-label="Page footer" data-placeholder="Footer: click to type or add a page number."></div>
        <article class="doc" id="editor" contenteditable="true" spellcheck="true"
                 role="textbox" aria-multiline="true" aria-label="Document"><p><br></p></article>
        <div class="fn-list doc" id="footnoteList" aria-label="Footnotes" hidden></div>
        <div class="img-resizer" id="imgResizer" hidden>
          <span class="img-handle" id="imgHandle" title="Drag to resize"></span>
          <span class="img-size" id="imgSize"></span>
        </div>
      </div>
    </div>
    <div class="hf-bar" id="hfBar" role="toolbar" aria-label="Header and footer formatting" hidden>
      <button type="button" class="tb-btn" data-hf="bold" title="Bold" aria-label="Bold"><b>B</b></button>
      <button type="button" class="tb-btn" data-hf="italic" title="Italic" aria-label="Italic"><i>I</i></button>
      <button type="button" class="tb-btn" data-hf="underline" title="Underline" aria-label="Underline"><u>U</u></button>
      <span class="tb-sep" aria-hidden="true"></span>
      <button type="button" class="tb-btn" data-hf="justifyLeft" title="Align left" aria-label="Align left">&#8676;</button>
      <button type="button" class="tb-btn" data-hf="justifyCenter" title="Centre" aria-label="Centre">&#8596;</button>
      <button type="button" class="tb-btn" data-hf="justifyRight" title="Align right" aria-label="Align right">&#8677;</button>
      <span class="tb-sep" aria-hidden="true"></span>
      <button type="button" class="tb-btn hf-text" data-hf="PAGE" title="Insert the page number">Page&nbsp;#</button>
      <button type="button" class="tb-btn hf-text" data-hf="NUMPAGES" title="Insert the total number of pages">Pages</button>
      <button type="button" class="tb-btn hf-text" data-hf="clear" title="Clear this header or footer">Clear</button>
    </div>
    <div class="drop-hint" id="dropHint" hidden><p>Drop a .docx or .doc file to open it</p></div>
  </main>

  <!-- ================= Status bar ================= -->
  <footer class="statusbar">
    <span id="statPages">Page 1 of 1</span>
    <span id="statWords">0 words</span>
    <span id="statChars" class="hide-narrow">0 characters</span>
    <span class="status-spacer"></span>
    <span class="hide-narrow" id="statPaper">Letter</span>
    <div class="zoom" role="group" aria-label="Zoom">
      <button type="button" class="tb-btn" id="zoomOut" aria-label="Zoom out">−</button>
      <button type="button" class="zoom-value" id="zoomValue" title="Fit page width">100%</button>
      <button type="button" class="tb-btn" id="zoomIn" aria-label="Zoom in">+</button>
    </div>
  </footer>
</div>

<!-- Generic modal used for confirmations, links and errors -->
<dialog class="modal" id="modal">
  <form method="dialog" class="modal-form" id="modalForm">
    <h2 class="modal-title" id="modalTitle"></h2>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-actions" id="modalActions"></div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<!-- ================= Third-party libraries (bundled in vendor/, pinned versions) ================= -->
<!-- JSZip: reads and writes the ZIP container that .docx files use -->
<script src="vendor/jszip.min.js"></script>
<!-- CFB: reads the OLE compound-file container of legacy .doc files (text extraction only) -->
<script src="vendor/cfb.min.js"></script>
<!-- mammoth (fallback .docx importer, ~640 KB) is loaded on demand from vendor/ by js/docx-import.js -->

<!-- ================= Application modules (order matters) ================= -->
<script src="js/util.js"></script>
<script src="js/ui.js"></script>
<script src="js/history.js"></script>
<script src="js/docx-import.js"></script>
<script src="js/doc-import.js"></script>
<script src="js/docx-export.js"></script>
<script src="js/editor.js"></script>
<script src="js/find-replace.js"></script>
<script src="js/header-footer.js"></script>
<script src="js/references.js"></script>
<script src="js/app.js"></script>
</body>
</html>
