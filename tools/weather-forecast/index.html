<div class="wx-wrap">
  <div class="wx-bar">
    <div class="wx-clock">
      <div class="wx-clock-time" id="wx-clock" aria-label="Current date and time in Vietnam"></div>
      <div class="hint">Vietnam time (UTC+7) · data by Open-Meteo, GDACS and USGS</div>
    </div>
    <div class="wx-bar-right">
      <span class="hint" id="wx-updated" role="status" aria-live="polite"></span>
      <button class="btn" type="button" data-action="refresh-all" id="wx-refresh-all"><i data-lucide="refresh-cw"></i> <span>Refresh all</span></button>
    </div>
  </div>
  <div id="wx-alerts"></div>
  <div class="wx-tabs" id="wx-tabs" role="tablist" aria-label="Location"></div>
  <div id="wx-view"></div>
</div>
