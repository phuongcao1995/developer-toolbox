<div class="toolbar tc-top">
  <div class="field"><label for="tc-from">From</label>
    <select id="tc-from" class="select">
      <option value="json">JSON</option>
      <option value="csv">CSV</option>
      <option value="markdown">Markdown table</option>
      <option value="xml">XML</option>
    </select></div>
  <button class="btn btn-icon tc-swap" id="tc-swap" type="button" title="Swap input and output" aria-label="Swap input and output"><i data-lucide="arrow-left-right"></i></button>
  <div class="field"><label for="tc-to">To</label>
    <select id="tc-to" class="select">
      <option value="csv">CSV</option>
      <option value="json">JSON</option>
      <option value="markdown">Markdown table</option>
      <option value="sql">SQL INSERT</option>
      <option value="xml">XML</option>
    </select></div>
  <button class="btn btn-primary" id="tc-convert" type="button"><i data-lucide="play"></i> Convert</button>
  <label class="check"><input type="checkbox" id="tc-auto" checked> Auto-convert</label>
  <span class="spacer"></span>
  <button class="btn" id="tc-sample" type="button"><i data-lucide="file-text"></i> Sample</button>
  <button class="btn" id="tc-upload" type="button"><i data-lucide="upload"></i> Upload</button>
  <button class="btn btn-danger" id="tc-clear" type="button"><i data-lucide="trash-2"></i> Clear</button>
</div>

<div class="panel tc-options">
  <div class="panel-body tc-opts-grid">
    <div class="field" data-for="csv-in csv-out"><label for="tc-delim">CSV delimiter</label>
      <select id="tc-delim" class="select">
        <option value="comma">Comma ( , )</option>
        <option value="semicolon">Semicolon ( ; )</option>
        <option value="tab">Tab</option>
        <option value="pipe">Pipe ( | )</option>
        <option value="auto">Auto-detect (input)</option>
      </select></div>
    <div class="field" data-for="csv-in"><label for="tc-quote">Quote character</label>
      <select id="tc-quote" class="select">
        <option value="&quot;">Double quote ( " )</option>
        <option value="'">Single quote ( ' )</option>
        <option value="auto">Auto-detect</option>
      </select></div>
    <div class="field" data-for="csv-in"><label for="tc-comment">Comment lines</label>
      <select id="tc-comment" class="select">
        <option value="">Not used</option>
        <option value="#">Ignore lines starting with #</option>
        <option value="//">Ignore lines starting with //</option>
        <option value=";">Ignore lines starting with ;</option>
      </select></div>
    <label class="check" data-for="csv-in" title="Remove spaces around unquoted values; also allows spaces before and after quotes"><input type="checkbox" id="tc-trim"> Trim whitespace</label>
    <label class="check" data-for="csv-in" title="Drop rows in which every cell is empty (such as ,,,). Completely blank lines are always skipped."><input type="checkbox" id="tc-skipempty"> Skip empty rows</label>
    <label class="check" data-for="csv-in" title="Rename repeated or blank header names (id, id_2, column_3). When off, repeated names are kept and JSON output keeps only the last value."><input type="checkbox" id="tc-dedupe" checked> De-duplicate headers</label>
    <div class="field" data-for="xml-out"><label for="tc-xmlroot">XML root element</label>
      <input id="tc-xmlroot" class="input" placeholder="rows (tables) / root (JSON)" spellcheck="false" autocomplete="off"></div>
    <div class="field" data-for="xml-out"><label for="tc-xmlrow">XML row element (tables)</label>
      <input id="tc-xmlrow" class="input" value="row" spellcheck="false" autocomplete="off"></div>
    <label class="check" data-for="csv-in csv-out json-in"><input type="checkbox" id="tc-header" checked> First row is header</label>
    <label class="check" data-for="json-in" title="Nested objects become dot-path columns (a.b). Arrays are not expanded: they stay as JSON text in one cell."><input type="checkbox" id="tc-flatten"> Flatten nested objects (dot paths; arrays stay JSON)</label>
    <label class="check" data-for="csv-out" title="Prefix cells starting with = + - @ (or tab/CR) with a single quote so spreadsheets do not run them as formulas"><input type="checkbox" id="tc-escf"> Escape formulas</label>
    <label class="check" data-for="csv-out" title="Add a UTF-8 byte order mark to the downloaded file so Excel detects the encoding"><input type="checkbox" id="tc-bom"> UTF-8 BOM (download)</label>
    <label class="check" data-for="csv-in markdown-in"><input type="checkbox" id="tc-infer"> Infer numbers / booleans</label>
    <label class="check" data-for="json-out sql-out"><input type="checkbox" id="tc-null"> Empty string as NULL</label>
    <div class="field" data-for="json-out"><label for="tc-shape">JSON shape</label>
      <select id="tc-shape" class="select"><option value="objects">Array of objects</option><option value="arrays">Array of arrays</option></select></div>
    <div class="field" data-for="markdown-out"><label for="tc-align">Markdown alignment</label>
      <select id="tc-align" class="select">
        <option value="auto">Auto (numbers right)</option><option value="left">Left</option>
        <option value="center">Center</option><option value="right">Right</option><option value="none">None</option>
      </select></div>
    <div class="field" data-for="sql-out"><label for="tc-table">Table name</label>
      <input id="tc-table" class="input" value="my_table" spellcheck="false" autocomplete="off"></div>
    <div class="field" data-for="sql-out"><label for="tc-dialect">SQL dialect</label>
      <select id="tc-dialect" class="select">
        <option value="ansi">ANSI / PostgreSQL / SQLite ("x")</option>
        <option value="mysql">MySQL / MariaDB (`x`)</option>
        <option value="sqlserver">SQL Server ([x])</option>
      </select></div>
    <label class="check" data-for="sql-out"><input type="checkbox" id="tc-multi" checked> Single multi-row INSERT</label>
  </div>
</div>

<div id="tc-msg" class="tc-msg" aria-live="assertive" hidden></div>
<div id="tc-warn" class="tc-msg" role="status" aria-live="polite" hidden></div>
<div id="tc-large" class="alert alert-warn tc-msg tc-large" role="status" hidden>
  <span id="tc-large-text"></span>
  <button class="btn btn-sm" id="tc-large-go" type="button">Convert anyway</button>
</div>
<div id="tc-progress" class="panel tc-msg tc-progress" role="status" aria-live="polite" hidden>
  <div class="panel-body tc-progress-body">
    <span id="tc-ptext">Converting…</span>
    <progress id="tc-pbar" max="100" value="0"></progress>
    <button class="btn btn-sm btn-danger" id="tc-cancel" type="button">Cancel</button>
  </div>
</div>

<div class="grid-2 tc-main">
  <div class="panel" id="tc-in-panel">
    <div class="panel-head"><h3>Input</h3><span class="hint" id="tc-in-stats"></span></div>
    <textarea id="tc-in" class="textarea code" aria-label="Input data" spellcheck="false" placeholder="Paste data here, drop a .csv / .json / .md / .txt file, or click Sample…"></textarea>
  </div>
  <div class="panel">
    <div class="panel-head">
      <h3>Output</h3><span class="hint" id="tc-out-stats"></span>
      <button class="btn btn-sm" id="tc-copy" type="button"><i data-lucide="copy"></i> Copy</button>
      <button class="btn btn-sm" id="tc-download" type="button"><i data-lucide="download"></i> Download</button>
    </div>
    <div class="tabs tc-tabs">
      <button class="tab active" data-tab="text" type="button">Text</button>
      <button class="tab" data-tab="preview" type="button">Preview table</button>
    </div>
    <div data-panel="text"><textarea id="tc-out" class="textarea code" aria-label="Converted output" readonly spellcheck="false" placeholder="Converted output appears here"></textarea></div>
    <div data-panel="preview" hidden>
      <div id="tc-preview" class="tc-preview"></div>
    </div>
  </div>
</div>
