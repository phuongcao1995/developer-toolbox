<div class="toolbar">
  <button class="btn btn-primary" data-action="compare"><i data-lucide="git-compare"></i> Compare</button>
  <button class="btn" data-action="swap"><i data-lucide="arrow-left-right"></i> Swap sides</button>
  <button class="btn" data-action="copy-a"><i data-lucide="copy"></i> Copy A</button>
  <button class="btn" data-action="copy-b"><i data-lucide="copy"></i> Copy B</button>
  <button class="btn btn-danger" data-action="clear"><i data-lucide="trash-2"></i> Clear both</button>
  <span class="spacer"></span>
  <label class="check"><input type="checkbox" id="df-auto" checked> Auto-compare</label>
</div>

<fieldset class="df-options">
  <legend>Compare options</legend>
  <label class="check"><input type="checkbox" id="df-case"> Ignore case</label>
  <label class="df-field">Whitespace
    <select class="select" id="df-ws" aria-label="Whitespace handling">
      <option value="none">Compare exactly</option>
      <option value="edges">Ignore leading/trailing</option>
      <option value="collapse">Collapse runs of whitespace</option>
      <option value="all">Ignore all whitespace</option>
    </select>
  </label>
  <label class="check"><input type="checkbox" id="df-trim"> Trim trailing whitespace</label>
  <label class="check"><input type="checkbox" id="df-blank"> Ignore blank lines</label>
  <label class="check"><input type="checkbox" id="df-eol" checked> Ignore line endings (CRLF/LF)</label>
</fieldset>

<div class="grid-2 df-inputs">
  <div class="panel">
    <div class="panel-head">
      <h3>Original</h3>
      <span class="hint" id="df-a-count"></span>
      <button class="btn btn-sm" data-action="upload-a"><i data-lucide="upload"></i> Open file</button>
    </div>
    <textarea class="textarea code" id="df-a" aria-label="Original text (A)" spellcheck="false" wrap="off" placeholder="Paste original text here, or drop a file…"></textarea>
  </div>
  <div class="panel">
    <div class="panel-head">
      <h3>Modified</h3>
      <span class="hint" id="df-b-count"></span>
      <button class="btn btn-sm" data-action="upload-b"><i data-lucide="upload"></i> Open file</button>
    </div>
    <textarea class="textarea code" id="df-b" aria-label="Modified text (B)" spellcheck="false" wrap="off" placeholder="Paste modified text here, or drop a file…"></textarea>
  </div>
</div>

<div id="df-guard" class="alert alert-warn" hidden>
  <span id="df-guard-text"></span>
  <button class="btn btn-sm" data-action="compare-anyway">Compare anyway</button>
</div>
<div id="df-msg" hidden></div>
<ul class="df-notes" id="df-notes" hidden></ul>
<div class="df-busy" id="df-busy" role="status" hidden><span class="spinner"></span> <span>Comparing large input…</span> <button class="btn btn-sm" data-action="cancel">Cancel</button></div>
<div class="sr-only" id="df-live" role="status" aria-live="polite"></div>

<div class="panel df-result">
  <div class="panel-head df-head">
    <h3>Differences</h3>
    <span class="badge badge-success" id="df-added" title="Added lines">+0</span>
    <span class="badge badge-danger" id="df-removed" title="Removed lines">−0</span>
    <span class="badge badge-warn" id="df-changed" title="Changed lines (replaced)">~0</span>
    <span class="badge badge-info" id="df-ident" title="Share of lines that are identical">100% identical</span>
  </div>
  <div class="df-controls">
    <div class="chips df-views" role="group" aria-label="View">
      <button class="chip active" data-view="side" aria-pressed="true">Side by side</button>
      <button class="chip" data-view="unified" aria-pressed="false">Unified</button>
    </div>
    <div class="chips df-views" role="group" aria-label="Highlight granularity">
      <button class="chip" data-gran="line" aria-pressed="false">Line</button>
      <button class="chip active" data-gran="word" aria-pressed="true">Word</button>
      <button class="chip" data-gran="char" aria-pressed="false">Character</button>
    </div>
    <label class="df-field">Context
      <select class="select" id="df-context" aria-label="Unchanged lines of context">
        <option value="0">0</option><option value="1">1</option><option value="3" selected>3</option><option value="5">5</option><option value="-1">All</option>
      </select>
    </label>
    <label class="check"><input type="checkbox" id="df-wrap"> Word wrap</label>
    <span class="spacer"></span>
    <button class="btn btn-sm" data-action="prev" aria-label="Previous change (p)" title="Previous change (p)"><i data-lucide="chevron-up"></i> Prev</button>
    <button class="btn btn-sm" data-action="next" aria-label="Next change (n)" title="Next change (n)"><i data-lucide="chevron-down"></i> Next</button>
    <span class="hint" id="df-pos"></span>
    <button class="btn btn-sm" data-action="copy"><i data-lucide="copy"></i> Copy patch</button>
    <button class="btn btn-sm" data-action="download"><i data-lucide="download"></i> Download .diff</button>
  </div>
  <div class="df-output" id="df-output" tabindex="0" role="region" aria-label="Diff result. Press n / p to jump between changes"><div class="empty">Enter text on both sides to see the differences.</div></div>
</div>
